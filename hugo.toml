baseURL = 'https://immortalcodes.github.io'
locale = 'en-IN'
title = 'ImmortalCodes'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "ImmortalCodes"
description = "Madhur Jain's personal site for engineering notes, projects, talks, and live browser experiments."
tagline = "More than a blog"
author = "Madhur Jain"
DateFormat = "January 2, 2006"
github = "https://github.com/immortalcodes"
linkedin = "https://www.linkedin.com/in/madhur-jain-37a243218/"
intro = "I am Madhur Jain, an engineer building practical software, writing down hard-won lessons, and keeping a small lab of interactive experiments alive on the web."

[outputs]
home = ["HTML", "RSS"]

[[menus.main]]
name = "Home"
url = "/"
weight = 10

[[menus.main]]
name = "Projects"
url = "/projects/"
weight = 20

[[menus.main]]
name = "Talks"
url = "/talks/"
weight = 30

[[menus.main]]
name = "Games"
url = "/games/"
weight = 40

[[menus.main]]
name = "Blog"
url = "/posts/"
weight = 50

[[menus.main]]
name = "Archive"
url = "/archive/"
weight = 60
